# Alembic configuration for the php2shell stats store.
# Connection URL resolution (first match wins):
#   1. the Storage instance's engine (app startup / recheck / tests)
#   2. PHP2SHELL_DATABASE_URL environment variable
#   3. PHP2SHELL_DB environment variable (SQLite path)
#   4. sqlalchemy.url below (SQLite default next to this file)

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///%(here)s/php2shell-stats.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
